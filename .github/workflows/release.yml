name: Release

# Push a version tag to build and publish a release, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Tags with a suffix (v0.2.0-beta.1) are published as pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release and upload its files

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=--pre" >> "$GITHUB_ENV"; else echo "PRERELEASE=" >> "$GITHUB_ENV"; fi

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/VersePreflight.App -p:PublishProfile=win-x64 -p:Version=${{ env.VERSION }} -o publish

      - name: Restore tools
        run: dotnet tool restore

      # Fetch the previous release so Velopack can build a small delta update (fails harmlessly on the first release)
      - name: Download previous release
        continue-on-error: true
        run: dotnet vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} ${{ env.PRERELEASE }} -o releases

      # Code signing goes here once available, via --signParams or --azureTrustedSignFile
      - name: Package
        run: >
          dotnet vpk pack
          --packId VersePreflight
          --packVersion ${{ env.VERSION }}
          --packDir publish
          --mainExe VersePreflight.exe
          --icon src/VersePreflight.App/Assets/app.ico
          --packTitle "Verse Preflight"
          --packAuthors "Verse Preflight contributors"
          --releaseNotes .github/release-notes.md
          -o releases

      - name: Upload to GitHub release
        run: >
          dotnet vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish ${{ env.PRERELEASE }}
          --releaseName "Verse Preflight ${{ env.VERSION }}"
          --tag ${{ github.ref_name }}
          -o releases
