name: Feature idea
description: Suggest something Verse Preflight could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Verse Preflight is free and non-commercial, and it never modifies the game's executables or Data.p4k, so ideas need to fit within that.
  - type: textarea
    id: description
    attributes:
      label: Your idea
      description: What would you like Verse Preflight to do, and what problem would it solve for you?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verse Preflight version
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      render: text
